syntax = "proto3";

package user.v1;

option go_package = "backend-diplomski/proto/gen/user/v1;userv1";

service UserService {
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse) {}
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUserByIdResponse {
  User user = 1;
}