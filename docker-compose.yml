services:
  postgres:
    image: postgres:16
    container_name: backend_diplomski_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user_service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_PORT: ${USER_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
      REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"

  content-service:
    platform: linux/amd64
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    container_name: content_service
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      APP_PORT: ${CONTENT_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: ${S3_USE_SSL}
    ports:
      - "${CONTENT_SERVICE_PORT}:${CONTENT_SERVICE_PORT}"

  interaction-service:
    platform: linux/amd64
    build:
      context: ./services/interaction-service
      dockerfile: Dockerfile
    container_name: interaction_service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_PORT: ${INTERACTION_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${INTERACTION_SERVICE_PORT}:${INTERACTION_SERVICE_PORT}"

  upload-service:
    platform: linux/amd64
    build:
      context: ./services/upload-service
      dockerfile: Dockerfile
    container_name: upload_service
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      APP_PORT: ${UPLOAD_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: ${S3_USE_SSL}
    ports:
      - "${UPLOAD_SERVICE_PORT}:${UPLOAD_SERVICE_PORT}"

  minio:
    image: minio/minio:latest
    container_name: feeder_minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: feeder_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  video-fetcher-worker:
    platform: linux/amd64
    build:
      context: ./services/video-worker
      dockerfile: Dockerfile
    container_name: video__worker
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - upload-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_SHORT_VIDEO_QUEUE: ${RABBITMQ_SHORT_VIDEO_QUEUE}
      UPLOAD_SERVICE_URL: http://upload-service:${UPLOAD_SERVICE_PORT}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      PEXELS_API_URL: ${PEXELS_API_URL}

      VIDEO_FETCH_AUTO_START: ${VIDEO_FETCH_AUTO_START}
      VIDEO_FETCH_INTERVAL_SECONDS: ${VIDEO_FETCH_INTERVAL_SECONDS}
      VIDEO_FETCH_QUERIES: ${VIDEO_FETCH_QUERIES}
      VIDEO_FETCH_LIMIT: ${VIDEO_FETCH_LIMIT}
      VIDEO_FETCH_ORIENTATION: ${VIDEO_FETCH_ORIENTATION}
      VIDEO_FETCH_MIN_DURATION_SECONDS: ${VIDEO_FETCH_MIN_DURATION_SECONDS}
      VIDEO_FETCH_MAX_DURATION_SECONDS: ${VIDEO_FETCH_MAX_DURATION_SECONDS}

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data: