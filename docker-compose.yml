services:
  postgres:
    image: postgres:16
    container_name: backend_diplomski_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user_service
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
    environment:
      APP_PORT: ${USER_SERVICE_PORT}
      HTTP_PORT: ${USER_SERVICE_HTTP_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
      REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS}
      RABBITMQ_URL: ${RABBITMQ_URL}
      EMAIL_VERIFICATION_BASE_URL: ${EMAIL_VERIFICATION_BASE_URL}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
      - "${USER_SERVICE_HTTP_PORT}:${USER_SERVICE_HTTP_PORT}"

  content-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: content_service
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      APP_PORT: ${CONTENT_SERVICE_PORT}
      GRPC_PORT: ${CONTENT_SERVICE_GRPC_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: ${S3_USE_SSL}
      VIDEO_WORKER_SERVICE_TOKEN: ${VIDEO_WORKER_SERVICE_TOKEN}
      RECOMMENDATION_SERVICE_TOKEN: ${RECOMMENDATION_SERVICE_TOKEN}
      INTERACTION_SIMULATOR_TOKEN: ${INTERACTION_SIMULATOR_TOKEN}

    ports:
      - "${CONTENT_SERVICE_PORT}:${CONTENT_SERVICE_PORT}"
      - "${CONTENT_SERVICE_GRPC_PORT}:${CONTENT_SERVICE_GRPC_PORT}"
  interaction-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/interaction-service/Dockerfile
    container_name: interaction_service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_PORT: ${INTERACTION_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      RECOMMENDATION_SERVICE_TOKEN: ${RECOMMENDATION_SERVICE_TOKEN}
      INTERACTION_SIMULATOR_TOKEN: ${INTERACTION_SIMULATOR_TOKEN}

    ports:
      - "${INTERACTION_SERVICE_PORT}:${INTERACTION_SERVICE_PORT}"
      - "${INTERACTION_SERVICE_GRPC_PORT}:${INTERACTION_SERVICE_GRPC_PORT}"

  upload-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
    container_name: upload_service
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      APP_PORT: ${UPLOAD_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: ${S3_USE_SSL}
      GRPC_PORT: ${GRPC_PORT}
      VIDEO_WORKER_SERVICE_TOKEN: ${VIDEO_WORKER_SERVICE_TOKEN}
    ports:
      - "${UPLOAD_SERVICE_PORT}:${UPLOAD_SERVICE_PORT}"
      - "${GRPC_PORT}:${GRPC_PORT}"

  minio:
    image: minio/minio:latest
    container_name: feeder_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: feeder_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  video-fetcher-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/video-worker/Dockerfile
    container_name: video__worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      upload-service:
        condition: service_started
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_SHORT_VIDEO_QUEUE: ${RABBITMQ_SHORT_VIDEO_QUEUE}
      UPLOAD_SERVICE_URL: http://upload-service:${UPLOAD_SERVICE_PORT}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      PEXELS_API_URL: ${PEXELS_API_URL}

      VIDEO_FETCH_AUTO_START: ${VIDEO_FETCH_AUTO_START}
      VIDEO_FETCH_INTERVAL_SECONDS: ${VIDEO_FETCH_INTERVAL_SECONDS}
      VIDEO_FETCH_QUERIES: ${VIDEO_FETCH_QUERIES}
      VIDEO_FETCH_LIMIT: ${VIDEO_FETCH_LIMIT}
      VIDEO_FETCH_ORIENTATION: ${VIDEO_FETCH_ORIENTATION}
      VIDEO_FETCH_MIN_DURATION_SECONDS: ${VIDEO_FETCH_MIN_DURATION_SECONDS}
      VIDEO_FETCH_MAX_DURATION_SECONDS: ${VIDEO_FETCH_MAX_DURATION_SECONDS}
      UPLOAD_SERVICE_GRPC_URL: ${UPLOAD_SERVICE_GRPC_URL}
      CONTENT_SERVICE_GRPC_URL: ${CONTENT_SERVICE_GRPC_URL}
      VIDEO_WORKER_SERVICE_TOKEN: ${VIDEO_WORKER_SERVICE_TOKEN}

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
        - "1025:1025"
        - "8025:8025"

  email-worker:
    build:
      context: .
      dockerfile: services/email-worker/Dockerfile
    container_name: email_worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      EMAIL_VERIFICATION_QUEUE: email-verification

      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_NAME: Feeder
      SMTP_FROM_EMAIL: no-reply@feeder.local
    depends_on:
      - rabbitmq
      - mailpit

  recommendation-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    container_name: recommendation_service
    restart: unless-stopped
    environment:
      GRPC_PORT: ${RECOMMENDATION_SERVICE_GRPC_PORT}
      RECOMMENDATION_SERVICE_TOKEN: ${RECOMMENDATION_SERVICE_TOKEN}
      INTERACTION_SERVICE_GRPC_URL: ${INTERACTION_SERVICE_GRPC_URL}
      CONTENT_SERVICE_GRPC_URL:  ${CONTENT_SERVICE_GRPC_URL}
      ML_INFERENCE_URL: ${ML_INFERENCE_URL}

    ports:
      - "${RECOMMENDATION_SERVICE_GRPC_PORT}:${RECOMMENDATION_SERVICE_GRPC_PORT}"

    depends_on:
      - interaction-service
      - content-service

  ml-inference:
    build:
      context: ./services/recommendation-service/ml
      dockerfile: Dockerfile
    container_name: ml_inference
    ports:
      - "8090:8090"
    restart: unless-stopped




volumes:
  postgres_data:
  minio_data:
  rabbitmq_data: