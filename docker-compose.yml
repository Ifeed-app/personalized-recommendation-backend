services:
  postgres:
    image: postgres:16
    container_name: backend_diplomski_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user_service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_PORT: 8060
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: video_platform
      JWT_SECRET: 11a9677b3d89f57aab781e69fa2a2ab53befcb5670e60c02a1823ba0e9fa1138
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_HOURS: 720
    ports:
      - "8060:8060"

  content-service:
    platform: linux/amd64
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    container_name: content_service
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: video_platform
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: feeder-media
      S3_REGION: us-east-1
      S3_USE_SSL: false
    ports:
      - "8080:8080"

  interaction-service:
    platform: linux/amd64
    build:
      context: ./services/interaction-service
      dockerfile: Dockerfile
    container_name: interaction_service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_PORT: 8070
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: video_platform
    ports:
      - "8070:8070"

  upload-service:
    platform: linux/amd64
    build:
      context: ./services/upload-service
      dockerfile: Dockerfile
    container_name: upload_service
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      APP_PORT: 8050
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: video_platform
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: feederbucket
      S3_REGION: us-east-1
      S3_USE_SSL: false
    ports:
      - "8050:8050"

  minio:
    image: minio/minio:latest
    container_name: feeder_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: