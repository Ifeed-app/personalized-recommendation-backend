name: Backend Stage Images

on:
  push:
    branches:
      - ft/ci_setup
      # kasnije promijenimo u develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: user-service
            context: .
            dockerfile: ./services/user-service/Dockerfile

          - name: content-service
            context: .
            dockerfile: ./services/content-service/Dockerfile

          - name: interaction-service
            context: .
            dockerfile: ./services/interaction-service/Dockerfile

          - name: upload-service
            context: .
            dockerfile: ./services/upload-service/Dockerfile

          - name: video-fetcher-worker
            context: .
            dockerfile: ./services/video-worker/Dockerfile

          - name: email-worker
            context: .
            dockerfile: ./services/email-worker/Dockerfile

          - name: recommendation-service
            context: .
            dockerfile: ./services/recommendation-service/Dockerfile

          - name: ml-inference
            context: ./services/recommendation-service/ml
            dockerfile: ./services/recommendation-service/ml/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ifeed-app/${{ matrix.name }}:stage
            ghcr.io/ifeed-app/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}