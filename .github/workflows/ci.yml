name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.8'
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Download dependencies
        shell: bash
        run: |
          set -e

          while IFS= read -r mod; do
            dir="$(dirname "$mod")"

            echo "Downloading dependencies in $dir"

            (
              cd "$dir"
              go mod download
            )
          done < <(find . -name go.mod -not -path './.git/*' | sort)

      - name: Run tests
        shell: bash
        run: |
          set -e

          while IFS= read -r mod; do
            dir="$(dirname "$mod")"

            echo "Testing $dir"

            (
              cd "$dir"
              go test ./...
            )
          done < <(find . -name go.mod -not -path './.git/*' | sort)

      - name: Build
        shell: bash
        run: |
          set -e

          while IFS= read -r mod; do
            dir="$(dirname "$mod")"

            echo "Building $dir"

            (
              cd "$dir"
              go build ./...
            )
          done < <(find . -name go.mod -not -path './.git/*' | sort)